name: Denken
on:
  schedule:
    - cron: "0 20 * * 0"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  denken:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: ./.github/actions/werkzeuge
        with: { claude: "true" }
      - env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        # think.mjs lässt zuerst den Optimierer die Gewichte nachrechnen, dann entscheidet Claude in der Whitelist
        run: node automatik/think.mjs
      - if: always()
        run: 'node automatik/sichern.mjs "Denk-Lauf: Erkenntnis und Gewichte" learnings.md plan data'
