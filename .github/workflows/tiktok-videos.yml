name: TikTok-Videos
# Jeden Tag zwei TikTok-Videos (dasselbe Video zusätzlich als Instagram-Reel), voll automatisch (automatik/tiktok-video.mjs): Skript von Claude (Abo), Regelprüfung im Code,
# Stimme Liam (ElevenLabs, ELEVENLABS_API_KEY) bzw. Piper/Thorsten als Rückfall, Video mit HyperFrames nach video/tiktok, Upload über die Content Posting API.
# Öffentlich postet Zernio (ZERNIO_API_KEY, Gratis-Stufe). Ohne Zernio oder wenn es scheitert: eigene App; die hat keinen
# Direct-Post-Audit, also geht das Video als Entwurf ins TikTok-Postfach (Titel im Artefakt <video>.mp4.txt). Datei PAUSE stoppt alles.
on:
  # Wie bei den Karussells: jeder Lauf, der startet, baut die fehlenden Videos der nächsten 48 h und plant sie bei Zernio ein
  # (TikTok und Reel, Uhrzeiten video_slots in plan/tiktok-plan.json).
  schedule:
    - cron: "*/20 * * * *"
  workflow_run:
    workflows: ["Akquise"]
    types: [completed]
  workflow_dispatch:
    inputs:
      modus:
        description: "auto, oeffentlich, privat (SELF_ONLY) oder entwurf"
        type: choice
        options: [auto, oeffentlich, privat, entwurf]
        default: auto
      anzahl: { description: "Wie viele Videos", default: "1" }
      saeule: { description: "Säule erzwingen (tipps, werkzeuge, design), leer = abwechselnd", default: "" }
      echt: { description: "Hochladen (sonst nur bis zum fertigen MP4)", type: boolean, default: true }
      vorplanen: { description: "Alle fehlenden Videos der nächsten 48 h bauen und bei Zernio einplanen", type: boolean, default: false }
permissions:
  contents: write
concurrency:
  group: tiktok-video
  cancel-in-progress: false
jobs:
  slot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      los: ${{ steps.wahl.outputs.los }}
      liste: ${{ steps.wahl.outputs.liste }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          sparse-checkout: |
            PAUSE
            plan
            data/tiktok-videos.json
            automatik/tiktok-plan.mjs
          sparse-checkout-cone-mode: false
      - id: wahl
        run: |
          if [ -f PAUSE ]; then echo "PAUSE vorhanden."; exit 0; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.vorplanen }}" != "true" ]; then echo "los=ja" >> "$GITHUB_OUTPUT"; exit 0; fi
          liste=$(node automatik/tiktok-plan.mjs video | tr '\n' ';')
          echo "Fehlt: ${liste:-nichts}"
          echo "liste=$liste" >> "$GITHUB_OUTPUT"
  video:
    needs: slot
    if: needs.slot.outputs.los == 'ja' || needs.slot.outputs.liste != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      MEDIA_REPO: ${{ vars.MEDIA_REPO || 'Ripptu/vamela-insta-media' }}
      MEDIA_TOKEN: ${{ secrets.MEDIA_TOKEN }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
      # Stimme Liam (ElevenLabs), sobald das Secret ELEVENLABS_API_KEY gesetzt ist, sonst Piper; Variable TIKTOK_STIMME=piper erzwingt Piper
      TIKTOK_STIMME: ${{ vars.TIKTOK_STIMME || '' }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      KIE_API_KEY: ${{ secrets.KIE_API_KEY }}
      MODUS: ${{ inputs.modus || 'auto' }}
      ANZAHL: ${{ inputs.anzahl || '1' }}
      SAEULE: ${{ inputs.saeule || '' }}
      ECHT: ${{ github.event_name != 'workflow_dispatch' || inputs.echt }}
      LISTE: ${{ needs.slot.outputs.liste }}
      HYPERFRAMES_SKIP_SKILLS: "1"
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Pause?
        id: pause
        run: if [ -f PAUSE ]; then echo "PAUSE vorhanden, kein Video."; echo "an=true" >> "$GITHUB_OUTPUT"; fi
      - uses: ./.github/actions/werkzeuge
        if: steps.pause.outputs.an != 'true'
        with: { rendern: "true", claude: "true", whisper: "false" }
      # HyperFrames braucht Node 22 (die Werkzeuge richten Node 20 ein)
      - uses: actions/setup-node@v4
        if: steps.pause.outputs.an != 'true'
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        if: steps.pause.outputs.an != 'true'
        with: { python-version: "3.12" }
      - name: Piper (Stimme)
        if: steps.pause.outputs.an != 'true'
        run: pip install -q piper-tts==1.8.0
      - uses: actions/cache@v4
        if: steps.pause.outputs.an != 'true'
        with:
          path: |
            ~/.cache/vamela-insta/piper
            ~/.cache/hyperframes
          key: tiktok-video-piper-thorsten-high-hyperframes-0.9.8
      - name: Chrome für HyperFrames
        if: steps.pause.outputs.an != 'true'
        run: npx --yes hyperframes@0.9.8 browser ensure
      - name: Videos bauen und posten
        if: steps.pause.outputs.an != 'true'
        run: |
          extra=""
          [ "$ECHT" = "true" ] && extra="--echt"
          [ -n "$SAEULE" ] && extra="$extra --saeule=$SAEULE"
          if [ -z "$LISTE" ]; then
            node automatik/tiktok-video.mjs --anzahl="$ANZAHL" --modus="$MODUS" $extra
          else
            fehler=0
            IFS=';' read -ra zeilen <<< "$LISTE"
            for z in "${zeilen[@]}"; do
              [ -z "$z" ] && continue
              um="${z%% *}"
              echo "::group::Video $um"
              node automatik/tiktok-video.mjs --anzahl=1 --modus=auto --echt --um="$um" || fehler=1
              node automatik/sichern.mjs "TikTok-Video: geplant für $um" data || true
              echo "::endgroup::"
            done
            exit $fehler
          fi
      - uses: actions/upload-artifact@v4
        if: always() && steps.pause.outputs.an != 'true'
        with:
          name: tiktok-videos-${{ github.run_id }}
          path: |
            out/tiktok-video/*/renders/*.mp4
            out/tiktok-video/*/renders/*.txt
            out/tiktok-video/*/inhalt.json
            out/tiktok-video/*/assets/stimme/stimme.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Verlauf und Token speichern
        if: always() && steps.pause.outputs.an != 'true'
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            node automatik/sichern.mjs "TikTok-Video" data
          else
            # Testlauf auf einem Zweig: nur Verlauf, Token und Kontodaten nach main, nicht den Code des Zweigs
            git fetch -q --depth=1 origin main
            git worktree add -q "$RUNNER_TEMP/haupt" origin/main
            cp data/tiktok-token.enc data/tiktok-konto.json "$RUNNER_TEMP/haupt/data/" 2>/dev/null || true
            [ -f data/tiktok-videos.json ] && cp data/tiktok-videos.json "$RUNNER_TEMP/haupt/data/"
            cd "$RUNNER_TEMP/haupt" && node automatik/sichern.mjs "TikTok-Video (Test ${GITHUB_REF_NAME})" data
          fi
