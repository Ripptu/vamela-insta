name: Prüfen
on:
  workflow_dispatch:
    inputs:
      max: { description: "Höchstens so viele Beiträge prüfen", type: string, default: "99" }
permissions:
  contents: write
concurrency:
  group: produzieren
  cancel-in-progress: false
jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: ./.github/actions/werkzeuge
        with: { claude: "true" }
      - run: sudo apt-get install -y -qq ffmpeg >/dev/null 2>&1 || true
      - name: Prüfen (acht gleichzeitig, Zwischenstand wird laufend gespeichert)
        run: |
          node automatik/qa-lauf.mjs --max 99 --parallel 8 || true
          node automatik/sichern.mjs "Prüfung: Ergebnisse" plan
