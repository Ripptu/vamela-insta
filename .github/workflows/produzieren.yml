name: Produzieren und prüfen
on:
  schedule:
    - cron: "20 2,14 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: produzieren
  cancel-in-progress: false
jobs:
  pruefen:
    runs-on: ubuntu-latest
    outputs:
      noetig: ${{ steps.p.outputs.noetig }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - id: p
        run: node automatik/puffer.mjs
  produzieren:
    needs: pruefen
    if: needs.pruefen.outputs.noetig == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      # Repo-Prüfung der Fundstücke (automatik/repo-check.mjs): 5.000 statt 60 GitHub-Anfragen je Stunde, kostenlos
      GITHUB_TOKEN: ${{ github.token }}
      # Gratis-Bildkette (render/gratis.mjs): Cloudflare FLUX.2 klein, zuletzt Pollinations; ersetzt Higgsfield (14.10.2026)
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      POLLINATIONS_KEY: ${{ secrets.POLLINATIONS_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: ./.github/actions/werkzeuge
        with: { rendern: "true", claude: "true", whisper: "auto" }
      - name: Preise und Adressen mit vamela.de abgleichen (bricht bei Abweichung ab)
        run: node automatik/fakten.mjs --live
      - name: Vorrat prüfen und ggf. neue Inhalte schreiben
        run: |
          node automatik/vorrat.mjs
      - name: Reparieren, nachproduzieren und prüfen (Zeitbudget 80 Minuten, danach sichert der nächste Schritt)
        env:
          FILL_BUDGET_MIN: "80"
        run: node automatik/fill.mjs
      - name: Suchbegriffe für neue Karussells ergänzen (Google-Vorschläge)
        if: always()
        run: node automatik/suchbegriffe.mjs --fehlende || true
      - name: TikTok-Fassungen rendern (1080 × 1920)
        if: always()
        run: node automatik/tiktok-bilder.mjs
      - name: Stand speichern (mit Zusammenführen bei parallelen Änderungen)
        if: always()
        run: 'node automatik/sichern.mjs "Produktion: Puffer aufgefüllt" plan out data docs bilder stimme'
