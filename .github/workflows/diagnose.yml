name: Diagnose Instagram-Zugang
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Rohe API-Antworten (ohne Token)
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
        run: node automatik/diagnose.mjs
